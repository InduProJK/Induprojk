<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos y Dotaciones</title>
  <style>
    :root {
      --primary: #1A365D;
      --accent: #2B6CB0;
      --bg: #F7FAFC;
      --text: #2D3748;
      --card-bg: #FFFFFF;
      --admin-color: #C53030;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto 30px auto;
      padding-bottom: 15px;
      border-bottom: 2px solid #E2E8F0;
    }

    h1 {
      color: var(--primary);
      margin: 0;
      font-size: 1.8rem;
    }

    .admin-btn {
      background: none;
      border: 1px solid #CBD5E0;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .admin-btn:hover {
      background-color: #EDF2F7;
    }

    /* Modales y Paneles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #CBD5E0;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Grilla de Productos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid #E2E8F0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.2rem;
      margin: 0 0 10px 0;
      color: var(--primary);
    }

    .card-desc {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .card-price {
      font-weight: bold;
      font-size: 1.1rem;
      color: #2B6CB0;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 15px;
    }

    .tag {
      background: #EBF8FF;
      color: #2B6CB0;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .admin-controls {
      display: none;
      background: #FFF5F5;
      border-top: 1px solid #FEB2B2;
      padding: 10px;
      gap: 10px;
    }

    .btn-edit {
      background-color: #3182CE;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      flex: 1;
    }

    .btn-delete {
      background-color: #E53E3E;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      flex: 1;
    }

    .ws-btn {
      background-color: #25D366;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo de Productos</h1>
    <button class="admin-btn" id="loginBtn" onclick="openModal('loginModal')">🔒 Admin</button>
  </header>

  <!-- Panel de Admin (Visible tras autenticación) -->
  <div id="adminPanel" style="display:none; max-width:1200px; margin: 0 auto 30px auto; background:#EDF2F7; padding:15px; border-radius:8px;">
    <h3>🛠️ Modo Administrador Activo</h3>
    <button onclick="openModal('productModal')" style="background:#2B6CB0; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; font-weight:bold;">+ Agregar Nuevo Producto</button>
    <button onclick="logout()" style="background:#718096; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; margin-left:10px;">Cerrar Sesión</button>
  </div>

  <!-- Grilla de Productos -->
  <div class="grid" id="productGrid">
    <!-- Las prendas guardadas se cargarán dinámicamente desde Firebase aquí -->
  </div>

  <!-- Modal Login -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h2>Ingreso Administrador</h2>
      <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="loginEmail">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword">
      </div>
      <button class="btn-submit" onclick="login()">Ingresar</button>
      <button onclick="closeModal('loginModal')" style="width:100%; margin-top:10px; background:none; border:none; cursor:pointer;">Cancelar</button>
    </div>
  </div>

  <!-- Modal Agregar / Editar Producto -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h2 id="modalTitle">Nuevo Producto</h2>
      <input type="hidden" id="editProductId">
      
      <div class="form-group">
        <label>Nombre del Producto</label>
        <input type="text" id="prodName" placeholder="Ej: Chaqueta Premium #1">
      </div>
      <div class="form-group">
        <label>Foto de Portada / Muestra</label>
        <input type="file" id="prodImage" accept="image/*">
      </div>
      <div class="form-group">
        <label>Precio / Cotización Base ($)</label>
        <input type="text" id="prodPrice" placeholder="Ej: 85.000 o Según Cotización">
      </div>
      <div class="form-group">
        <label>Descripción y Especificaciones</label>
        <textarea id="prodDesc" rows="3" placeholder="Detalles de tela (Drill, Ignífuga), parches, bordados..."></textarea>
      </div>
      <div class="form-group">
        <label>Etiquetas (Separadas por comas)</label>
        <input type="text" id="prodTags" placeholder="Chaqueta, Ingeniero, Dotación">
      </div>

      <button class="btn-submit" id="saveProdBtn" onclick="saveProduct()">Guardar Producto</button>
      <button onclick="closeModal('productModal')" style="width:100%; margin-top:10px; background:none; border:none; cursor:pointer;">Cancelar</button>
    </div>
  </div>

  <!-- Configuración de Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Reemplaza estas variables con tus llaves reales de Firebase Console
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO_ID",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let isAdmin = false;

    // Monitor de Sesión
    onAuthStateChanged(auth, (user) => {
      if (user) {
        isAdmin = true;
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('loginBtn').innerText = '🔓 Modo Admin';
      } else {
        isAdmin = false;
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginBtn').innerText = '🔒 Admin';
      }
      loadProducts();
    });

    window.login = async () => {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        closeModal('loginModal');
      } catch (e) {
        alert("Error al iniciar sesión: " + e.message);
      }
    };

    window.logout = () => signOut(auth);

    // Cargar productos desde Firestore
    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      const querySnapshot = await getDocs(collection(db, "productos"));

      querySnapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        
        const tagsHTML = item.tags ? item.tags.map(t => `<span class="tag">${t.trim()}</span>`).join('') : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.imageUrl || 'https://via.placeholder.com/300'}" alt="${item.nombre}">
          <div class="card-body">
            <h3 class="card-title">${item.nombre}</h3>
            <div class="card-price">${item.precio}</div>
            <p class="card-desc">${item.descripcion}</p>
            <div class="tags">${tagsHTML}</div>
            <a href="https://wa.me/573000000000?text=Hola,%20quisiera%20cotizar:%20${encodeURIComponent(item.nombre)}" class="ws-btn" target="_blank">Cotizar por WhatsApp</a>
          </div>
          <div class="admin-controls" style="display: ${isAdmin ? 'flex' : 'none'};">
            <button class="btn-edit" onclick="editProduct('${id}', '${item.nombre}', '${item.precio}', '${item.descripcion}')">✏️ Editar / Reemplazar Foto</button>
            <button class="btn-delete" onclick="deleteProduct('${id}')">🗑️ Eliminar</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Guardar o Actualizar Producto
    window.saveProduct = async () => {
      const id = document.getElementById('editProductId').value;
      const nombre = document.getElementById('prodName').value;
      const precio = document.getElementById('prodPrice').value;
      const descripcion = document.getElementById('prodDesc').value;
      const tags = document.getElementById('prodTags').value.split(',');
      const fileInput = document.getElementById('prodImage');

      if (!nombre) { alert("Ingresa un nombre"); return; }

      let imageUrl = null;
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const storageRef = ref(storage, 'productos/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
      }

      if (id) {
        // Editar existente
        const docRef = doc(db, "productos", id);
        const updateData = { nombre, precio, descripcion, tags };
        if (imageUrl) updateData.imageUrl = imageUrl; // Reemplaza la foto solo si se sube una nueva
        await updateDoc(docRef, updateData);
      } else {
        // Crear nuevo
        await addDoc(collection(db, "productos"), {
          nombre,
          precio,
          descripcion,
          tags,
          imageUrl: imageUrl || 'https://via.placeholder.com/300',
          fecha: new Date()
        });
      }

      closeModal('productModal');
      loadProducts();
    };

    window.editProduct = (id, nombre, precio, descripcion) => {
      document.getElementById('modalTitle').innerText = 'Editar / Reemplazar Foto';
      document.getElementById('editProductId').value = id;
      document.getElementById('prodName').value = nombre;
      document.getElementById('prodPrice').value = precio;
      document.getElementById('prodDesc').value = descripcion;
      openModal('productModal');
    };

    window.deleteProduct = async (id) => {
      if (confirm("¿Segura que deseas eliminar esta prenda del catálogo?")) {
        await deleteDoc(doc(db, "productos", id));
        loadProducts();
      }
    };

    window.openModal = (id) => document.getElementById(id).style.display = 'flex';
    window.closeModal = (id) => {
      document.getElementById(id).style.display = 'none';
      if(id === 'productModal') {
        document.getElementById('editProductId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodDesc').value = '';
        document.getElementById('prodTags').value = '';
      }
    };
  </script>
</body>
</html>
